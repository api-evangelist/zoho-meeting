    name: Zoho Meeting REST API
    description: >-
      REST API for creating, updating, and reporting on Zoho Meeting sessions
      and Zoho Webinar events, including registrants, recordings, and meeting
      links. Requests are authenticated with OAuth 2.0 access tokens via the
      Authorization header.
