aid: zoho-meeting
name: Zoho Meeting
description: >-
  Zoho Meeting is an online meeting, video conferencing, and webinar platform
  from Zoho that lets teams host secure meetings, presentations, and recorded
  webinars from any device. The Zoho Meeting REST API enables programmatic
  scheduling, management, and reporting of meetings and webinars, including
  registrant handling and session lifecycle. Authentication uses Zoho's OAuth
  2.0 (Zoho-oauthtoken) with domain-specific API endpoints.
